# Add to root Compose; backend source and production defaults are unchanged.
services:
  backend:
    environment:
      AUTH_COOKIE_MODE: secure
      AUTH_PUBLIC_ORIGIN: https://localhost:4200
      AUTH_ORIGINS: https://localhost:4200
      AUTH_TRUST_PROXY: 172.30.47.2/32
    networks:
      default: {}
      frontend_proxy:
        ipv4_address: 172.30.47.3
  frontend:
    build:
      context: ./frontend
      target: development
    init: true
    ports:
      - '127.0.0.1:4200:4200'
    volumes:
      - ./frontend:/app
      - frontend_node_modules:/app/node_modules
      - ./frontend/.certs:/app/.certs:ro
    networks:
      frontend_proxy:
        ipv4_address: 172.30.47.2
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('https://localhost:4200').then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 12
    environment:
      NODE_EXTRA_CA_CERTS: /app/.certs/ca.pem
networks:
  frontend_proxy:
    ipam:
      config:
        - subnet: 172.30.47.0/29
volumes:
  frontend_node_modules:
