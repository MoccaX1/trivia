<div class="shell">
  <header class="header">
    <a class="brand" routerLink="/" aria-label="Trivia home">
      <span class="brand-mark" aria-hidden="true">t</span>
      <span>Trivia</span>
    </a>
    <span class="edition">A little friendly competition.</span>

  <main id="main-content" tabindex="-1">

      session.state().status === 'checking' && !session.pending() && router.currentNavigation()

      <p role="status">Checking your session…</p>
    }
    <router-outlet />
  </main>
  <footer class="footer">Room for curiosity. Ready for what comes next.</footer>
</div>
