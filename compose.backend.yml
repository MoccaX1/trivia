services:
  backend:
    build:
      context: ./backend
      target: runtime
    environment:
      HOST: 0.0.0.0
      PORT: 3000
      LOG_LEVEL: ${LOG_LEVEL:-info}
      AUTH_COOKIE_MODE: ${AUTH_COOKIE_MODE:-secure}
      AUTH_PUBLIC_ORIGIN: ${AUTH_PUBLIC_ORIGIN:-}
      AUTH_ORIGINS: ${AUTH_ORIGINS:-}
      AUTH_TRUST_PROXY: ${AUTH_TRUST_PROXY:-}
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://trivia:trivia_local@postgres:5432/trivia}
    ports:
      - '127.0.0.1:${PORT:-3000}:3000'
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test:
        [
          'CMD',
          'node',
          '-e',
          "fetch('http://127.0.0.1:3000/health', { signal: AbortSignal.timeout(2000) }).then(r => { if (!r.ok) process.exit(1) }).catch(() => process.exit(1))",
        ]
      interval: 5s
      timeout: 3s
      retries: 5
      start_period: 10s
    stop_grace_period: 15s

  postgres:
    image: postgres:17-bookworm
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-trivia}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-trivia_local}
      POSTGRES_DB: ${POSTGRES_DB:-trivia}
    ports:
      - '127.0.0.1:${POSTGRES_PORT:-5432}:5432'
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ['CMD-SHELL', 'pg_isready -U "$$POSTGRES_USER" -d "$$POSTGRES_DB"']
      interval: 5s
      timeout: 3s
      retries: 10
      start_period: 10s

  tools:
    profiles: [tools]
    build:
      context: ./backend
      target: development
    environment:
      DATABASE_URL: ${COMPOSE_DATABASE_URL:-postgresql://trivia:trivia_local@postgres:5432/trivia}
      TEST_DATABASE_URL: ${TEST_DATABASE_URL:-}
    command: npm run check

volumes:
  postgres_data:
